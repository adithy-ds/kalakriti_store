services:
  - type: web
    name: kalakriti-boutique
    runtime: python
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
